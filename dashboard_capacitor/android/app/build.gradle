apply plugin: 'com.android.application'

android {
    namespace "com.me.adhd"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.me.adhd"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 12216
        versionName '122.1.6'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        def servicesJSON = file('google-services.json')
        if (servicesJSON.exists()) {
            def googleServices = new groovy.json.JsonSlurper().parse(servicesJSON)
            def client = googleServices.client.find {
                it.client_info?.android_client_info?.package_name == "com.me.adhd"
            } ?: googleServices.client[0]
            resValue "string", "firebase_app_id", client.client_info.mobilesdk_app_id
            resValue "string", "firebase_api_key", client.api_key[0].current_key
            resValue "string", "firebase_project_id", googleServices.project_info.project_id
            resValue "string", "firebase_gcm_sender_id", googleServices.project_info.project_number
            resValue "string", "firebase_storage_bucket", googleServices.project_info.storage_bucket ?: ""
        }
    }
    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file('keystore.properties')
            if (!keystorePropertiesFile.exists()) {
                throw new GradleException(
                    "Missing android/keystore.properties. Copy keystore.properties.example, " +
                    "point storeFile to your upload keystore (adhd.jks), and rebuild. " +
                    "Play expects SHA1 FC:73:46:1F:7E:88:61:66:85:41:87:9B:50:82:77:22:0C:30:B9:31"
                )
            }
            def keystoreProperties = new Properties()
            keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.google.firebase:firebase-messaging:${rootProject.ext.firebaseMessagingVersion}"
    implementation "com.android.billingclient:billing:9.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def servicesJSON = file('google-services.json')
if (servicesJSON.exists() && servicesJSON.text.trim()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn("google-services.json not found; google-services plugin not applied. Push Notifications need CallGrabbrApplication fallback.")
}
